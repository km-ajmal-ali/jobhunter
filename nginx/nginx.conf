# =============================================================================
# Nginx configuration for JobHunter
#
# Serves the React frontend as static files and proxies /api requests
# to the FastAPI backend.
#
# Canonical domain: www.visajobsforyou.com
# Non-www requests are redirected to www.
# HTTPS is terminated by Cloudflare (Flexible SSL), so nginx only listens
# on port 80 internally.
# =============================================================================

upstream backend {
    server backend:8000;
}

# ── Redirect non-www → www ────────────────────────────────────────────
server {
    listen 80;
    server_name visajobsforyou.com;
    return 301 https://www.visajobsforyou.com$request_uri;
}

# ── Main site (www) ───────────────────────────────────────────────────
server {
    listen 80;
    server_name www.visajobsforyou.com;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache headers
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
