# =============================================================================
# Docker Compose for JobHunter
#
# Services:
#   - db:       PostgreSQL 16 (persistent storage)
#   - backend:  FastAPI + APScheduler (API + scraping cron)
#   - frontend: Nginx serving built React SPA + proxy to backend
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose logs -f                  # Tail logs
#   docker compose exec backend alembic upgrade head   # Run migrations
# =============================================================================

version: "3.9"

services:
  # ── Database ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: jobhunter-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-jobuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobpass}
      POSTGRES_DB: ${DB_NAME:-jobhunter}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobuser} -d ${DB_NAME:-jobhunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost for security

  # ── Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/${GHCR_OWNER:-your-org}/jobhunter-backend:latest
    container_name: jobhunter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-jobuser}:${DB_PASSWORD:-jobpass}@db:5432/${DB_NAME:-jobhunter}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost,http://192.168.29.188}
      SCRAPER_TIER1_SCHEDULE_HOUR: ${SCRAPER_TIER1_SCHEDULE_HOUR:-2}
      SCRAPER_TIER2_ENABLED: ${SCRAPER_TIER2_ENABLED:-false}
      SCRAPER_TIER2_SCHEDULE_HOUR: ${SCRAPER_TIER2_SCHEDULE_HOUR:-3}
      PROXY_LIST: ${PROXY_LIST:-}
    ports:
      - "127.0.0.1:8000:8000"  # Internal — Nginx proxies to this

  # ── Frontend / Reverse Proxy ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/${GHCR_OWNER:-your-org}/jobhunter-frontend:latest
    container_name: jobhunter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0.0.0.0:80:80"
volumes:
  pgdata:
    driver: local
