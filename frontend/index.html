<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find the latest job openings with visa sponsorship. Search jobs from multiple sources including LinkedIn, Indeed, Glassdoor, and H1B databases." />
    <title>JobHunter - Visa Sponsorship Jobs</title>
    <link rel="canonical" href="https://www.visajobsforyou.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="JobHunter" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobHunter - Visa Sponsorship Jobs" />
    <meta property="og:description" content="Find the latest job openings with visa sponsorship. Search jobs from multiple sources including LinkedIn, Indeed, Glassdoor, and H1B databases." />
    <meta property="og:url" content="https://www.visajobsforyou.com/" />
    <meta property="og:image" content="https://www.visajobsforyou.com/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JobHunter - Visa Sponsorship Jobs" />
    <meta name="twitter:description" content="Find the latest job openings with visa sponsorship. Search jobs from multiple sources including LinkedIn, Indeed, Glassdoor, and H1B databases." />
    <meta name="twitter:image" content="https://www.visajobsforyou.com/favicon.svg" />

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JobHunter",
        "url": "https://www.visajobsforyou.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.visajobsforyou.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6872881712264544"
      crossorigin="anonymous"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
